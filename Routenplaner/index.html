// Returns the Monday of the current real week
// Returns {y,m,d} of Monday of current week - pure arithmetic, no timezone issues
function getMondayOfCurrentWeek() {
  const now = new Date();
  const y = now.getFullYear();
  const mo = now.getMonth(); // 0-based
  const day = now.getDate();
  // Create date at noon local to get correct day
  const d = new Date(y, mo, day, 12, 0, 0);
  const dow = d.getDay(); // 0=Sun,1=Mon,...6=Sat
  const diff = dow===0 ? -6 : 1-dow;
  return new Date(y, mo, day+diff, 12, 0, 0);
}
// Add N weekdays (Mon-Fri) to a Monday base date → returns {dateStr}
function addWeekdays(mon, weekNum, dayOfWeek) {
  const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + weekNum*7 + dayOfWeek, 12, 0, 0);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
// Returns date string for day index (0=first Mon of planning)
function getDayDate(dayIndex) {
  const base = getMondayOfCurrentWeek();
  base.setDate(base.getDate() + Math.floor(dayIndex/5)*7 + dayIndex%5);
  return base;
}

const fmtDate = d => { if(!d)return"—"; const [y,m,dy]=d.split("-"); return dy+"."+m+"."+y; };
const daysSince = d => d ? Math.floor((Date.now()-new Date(d))/86400000) : null;
function routeKm(stops) {
  let km=0,pos=HOME;
  stops.forEach(s=>{km+=distKm(pos,s);pos=s;});
  return (km+distKm(pos,HOME)).toFixed(0);
}
// ─── SPESEN HELPERS ──────────────────────────────────────────────────────────
function getFurthestCity(doneStops, locations) {
  if(!doneStops||!doneStops.length) return "";
  let maxDist=-1, result="";
  doneStops.forEach(s=>{
    const loc=locations.find(l=>l.id===s.id);
    if(!loc||!loc.lat||!loc.lng) return;
    const d=distKm(HOME,loc);
    if(d>maxDist){maxDist=d;result=loc.city||s.city||"";}
  });
  return result;
}
function timeToMins(t){if(!t)return 0;const[h,m]=(t||"0:0").split(":");return parseInt(h)*60+parseInt(m);}
function minsToHHMM(m){const abs=Math.abs(m);return (m<0?"-":"")+String(Math.floor(abs/60)).padStart(2,"0")+":"+String(abs%60).padStart(2,"0");}
function roundQ(timeStr){if(!timeStr)return timeStr;const[h,m]=timeStr.split(":").map(Number);const r=Math.round((h*60+m)/15)*15;return String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");}
function computeSpesenRows(ym, routeLog, locations, spesenOverrides) {
  const [y,mo]=ym.split("-").map(Number);
  const holidays=getNRWHolidays(y);
  const rows=[];
  const daysInMonth=new Date(y,mo,0).getDate();
  const logByDate={};
  routeLog.forEach(e=>{if(e.date)logByDate[e.date]=e;});
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(y,mo-1,d,12);
    const wd=dt.getDay();
    if(wd===0||wd===6) continue;
    const dateStr=y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const over=spesenOverrides[dateStr]||{};
    // dayType: explicit override > migrate old type field > auto-detect feiertag > default stadt
    const autoFeiertag=holidays.has(dateStr);
    const dayType=over.dayType||(over.type==="feiertag"?"feiertag":over.type==="urlaub"?"urlaub":autoFeiertag?"feiertag":"stadt");
    const isFeiertag=dayType==="feiertag";
    const isUrlaub=dayType==="urlaub";
    const isKrank=dayType==="krank";
    const isUeAbbau=dayType==="ue_abbau";
    const isSpecialDay=isFeiertag||isUrlaub||isKrank||isUeAbbau;
    const logEntry=logByDate[dateStr];
    const sollMins=wd===5?450:540;
    const stdBeginn="08:00";
    const stdEnde=wd===5?"15:30":"17:00";
    // Manual override first; special days get standard times; work days get log data
    const beginn=over.beginn||(isSpecialDay?stdBeginn:(logEntry?roundQ(logEntry.startTime):""));
    const ende=over.ende||(isSpecialDay?stdEnde:(logEntry?roundQ(logEntry.endTime):""));
    const dauerMins=(beginn&&ende)?(timeToMins(ende)-timeToMins(beginn)):(isSpecialDay?sollMins:0);
    const reiseort=over.reiseort!=null?over.reiseort:(!isSpecialDay&&logEntry&&logEntry.doneStops?getFurthestCity(logEntry.doneStops,locations):"");
    const verpflegungBase=(!isSpecialDay&&dauerMins>=480)?14:0;
    const verpflegung=over.verpflegung!=null?over.verpflegung:verpflegungBase;
    rows.push({dateStr,wd,dayType,isFeiertag,isUrlaub,isKrank,isUeAbbau,isSpecialDay,beginn,ende,reiseort,dauerMins,sollMins,verpflegung,hasLogData:!!logEntry});
  }
  return rows;
}
function mapsUrl(stops,weekDay) {
  const wedLast = WEDNESDAY_LAST;
  const start = weekDay===3 ? wedLast.lat+","+wedLast.lng : HOME.lat+","+HOME.lng;
  const end   = weekDay===2 ? wedLast.lat+","+wedLast.lng : HOME.lat+","+HOME.lng;
  const wpts  = stops.map(s=>s.lat+","+s.lng).join("/");
  return "https://www.google.com/maps/dir/"+start+"/"+wpts+"/"+end;
}
function computeSchedule(stops,weekDay,fixedStops) {
  const wedLast = (fixedStops && fixedStops.wednesday) || WEDNESDAY_LAST;
  const startPos = weekDay===3 ? wedLast : HOME;
  let clock=WORK_START,pos=startPos;
  return stops.map(s=>{
    const travel = cachedTravelMin(pos, s);
    clock+=travel;
    const arrival=clock;
    clock+=(s.visitMin??VISIT_MIN_RUNTIME);
    const departure=clock;
    pos=s;
    return {...s,travelToMin:travel,arrival,departure};
  });
}
function getReturnTime(sched,weekDay,fixedStops) {
  if(!sched.length) return WORK_START;
  const last=sched[sched.length-1];
  if(weekDay===2) return last.departure||WORK_START;
  const dest = ((fixedStops&&fixedStops.wednesday)||WEDNESDAY_LAST);
  return (last.departure||WORK_START)+cachedTravelMin(last,HOME);
}

// ─── ROUTING ─────────────────────────────────────────────────────────────────
function timeToMin(t){ if(!t) return 0; const p=t.split(":"); return parseInt(p[0])*60+parseInt(p[1]||0); }

// Convert day index to local Date at noon
function planDayDate(di) {
  const mon = getMondayOfCurrentWeek();
  return new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + Math.floor(di/5)*7 + di%5, 12, 0, 0);
}

// Format day label from Date object
function fmtDayLabel(d) {
  return d.toLocaleDateString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit"});
}

// Date string YYYY-MM-DD from local Date (no UTC shift)
function dateStr(d) {
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// Convert YYYY-MM-DD to planning day index (-1 if past or weekend)
function dateToDayIndex(s) {
  const parts = s.split("-");
  const target = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]), 12, 0, 0);
  const mon = getMondayOfCurrentWeek();
  const diff = Math.round((target - mon) / 86400000);
  if(diff < 0) return -1;
  const week = Math.floor(diff/7);
  const dow  = diff % 7;
  if(dow >= 5) return -1; // weekend
  return week*5 + dow;
}

function planRoutes(locs, fixedStops, appts, carryFwdSet, visitedData) {
  const monFirst = (fixedStops&&fixedStops.monday)    || MONDAY_FIRST;
  const wedLast  = (fixedStops&&fixedStops.wednesday) || WEDNESDAY_LAST;
  const allAppts = appts || [];

  const monday = getMondayOfCurrentWeek();

  // Get appts for a specific date string, sorted by start time
  function getDayAppts(ds) {
    return allAppts
      .filter(a => a.date === ds)
      .map(a => ({
        id:       "appt_"+a.id,
        name:     a.title,
        city:     a.city||"",
        address:  a.address||"",
        lat:      a.lat,
        lng:      a.lng,
        start:    timeToMin(a.startTime),
        end:      timeToMin(a.endTime),
        visitMin: timeToMin(a.endTime) - timeToMin(a.startTime),
        isAppt:   true,
        apptData: a,
      }))
      .sort((a,b) => a.start-b.start);
  }

  // Check if time window [arr,dep] overlaps an appt window
  function overlapsAppt(arr, dep, dayAppts) {
    for(const a of dayAppts) {
      if(arr < a.end && dep > a.start) return true;
    }
    return false;
  }

  // Advance clock past any appt blocking current time
  function skipPastAppts(clock, dayAppts) {
    let c = clock, changed = true;
    while(changed) {
      changed = false;
      for(const a of dayAppts) {
        if(c >= a.start && c < a.end) { c = a.end; changed = true; }
      }
    }
    return c;
  }

  // Carry-forward stops (skipped from previous day) get planned first
  const cSet = carryFwdSet || new Set();
  const carryFwd = locs.filter(l => !l.fixed && cSet.has(l.id));
  const normal   = locs.filter(l => !l.fixed && !cSet.has(l.id));

  // Filter out customers visited within the last 10 weeks
  const TEN_WEEKS_MS = 10 * 7 * 24 * 60 * 60 * 1000;
  const nowMs = Date.now();
  const notRecentlyVisited = l => {
    const lastVisit = visitedData && visitedData[l.id] && visitedData[l.id].lastVisit;
    if(!lastVisit) return true;
    return (nowMs - new Date(lastVisit).getTime()) > TEN_WEEKS_MS;
  };

  let remaining  = [...carryFwd, ...normal].filter(notRecentlyVisited);
  const days = [];

  // Find last appt date index so we cover all appt days
  const lastApptDi = allAppts.length > 0
    ? Math.max(...allAppts.map(a => dateToDayIndex(a.date)).filter(x => x >= 0))
    : -1;

  for(let di = 0; di < 260; di++) {
    // Stop when no customers left AND no future appts
    if(remaining.length === 0 && di > lastApptDi) break;

    const wday   = di % 5;
    const dayDate = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + Math.floor(di/5)*7 + di%5, 12, 0, 0);
    const ds     = dateStr(dayDate);

    // Skip NRW public holidays
    if(isNRWHoliday(ds)) continue;

    // Check for spontaneous route override for this date
    try {
      const spontKey = "rp2_spont_"+ds;
      const spontData = localStorage.getItem(spontKey);
      if(spontData) {
        const spont = JSON.parse(spontData);
        if(spont.stops && spont.stops.length > 0) {
          // Use the spontaneous route for this day
          const spontStops = spont.stops.map(s=>({...s, isSpont:true}));
          days.push({ day:di+1, weekDay:wday, stops:spontStops, date:ds, appts:[], isSpont:true,
            spontFrom:{lat:spont.fromLat, lng:spont.fromLng, time:spont.fromTime} });
          // Remove these stops from remaining
          const spontIds = new Set(spont.stops.map(s=>s.id));
          remaining = remaining.filter(r=>!spontIds.has(r.id));
          continue; // Skip normal planning for this day
        }
      }
    } catch(e) {}

    const dayAppts = getDayAppts(ds);

    // Check for day-specific start/end overrides from setup
    const sd = lsGet("setup_data", {});
    const dayStartOverride = (sd.dayStarts||{})[wday];
    const dayEndOverride   = (sd.dayEnds||{})[wday];
    const customStart = dayStartOverride&&dayStartOverride.lat&&dayStartOverride.lng
      ? {name:dayStartOverride.addr||"Start",lat:parseFloat(dayStartOverride.lat),lng:parseFloat(dayStartOverride.lng)}
      : null;
    const customEnd = dayEndOverride&&dayEndOverride.lat&&dayEndOverride.lng
      ? {name:dayEndOverride.addr||"Ende",lat:parseFloat(dayEndOverride.lat),lng:parseFloat(dayEndOverride.lng),visitMin:0}
      : null;

    const startPos   = customStart || (wday===3 ? wedLast : HOME);
    const firstFixed = wday===0 ? monFirst : null;
    const endAnchor  = customEnd || (wday===2 ? wedLast : null);
    const returnDest = endAnchor || customStart || HOME;

    let clock = WORK_START;
    let pos   = startPos;
    const dayStops = [];
    const used = new Set();

    // Force Monday first stop (Juliette)
    if(firstFixed) {
      const tTo  = cachedTravelMin(pos, firstFixed);
      const arr  = clock + tTo;
      const dep  = arr + firstFixed.visitMin;
      clock = dep;
      dayStops.push({...firstFixed, travelToMin:tTo, arrival:arr, departure:dep});
      pos = firstFixed;
      used.add(firstFixed.id);
    }

    // Insert appts at their fixed times first (sorted)
    // We'll weave them in during the main loop

    // Main fill loop – time-based, no stop count limit
    let loopSafety = 0;
    while(500 > loopSafety++) {
      // Skip clock past any blocking appt
      clock = skipPastAppts(clock, dayAppts);

      // Check if next appt is coming soon – insert it
      const nextAppt = dayAppts.find(a => !used.has(a.id) && a.start >= clock);
      const timeToNextAppt = nextAppt ? nextAppt.start - clock : Infinity;

      // Try to find best customer stop that fits before next appt (or end of day)
      let best = null, bestScore = Infinity;
      for(const loc of remaining) {
        if(used.has(loc.id)) continue;
        const tTo = cachedTravelMin(pos, loc);
        const arr = clock + tTo;
        const dep = arr + VISIT_MIN_RUNTIME;

        // Must not overlap any appt
        if(overlapsAppt(arr, dep, dayAppts)) continue;

        // Must allow return home (or anchor) before WORK_END
        const tBack  = cachedTravelMin(loc, returnDest);
        const vBack  = endAnchor ? (endAnchor.visitMin||VISIT_MIN) : 0;
        if(dep + tBack + vBack > WORK_END) continue;

        // Score: travel time (nearest neighbour by time)
        if(tTo < bestScore) { bestScore=tTo; best=loc; }
      }

      // If no customer fits but there's an upcoming appt, jump to it
      if(!best && nextAppt && !used.has(nextAppt.id)) {
        const tTo = nextAppt.lat&&nextAppt.lng ? cachedTravelMin(pos, nextAppt) : 0;
        const arr = Math.max(clock + tTo, nextAppt.start);
        const dep = nextAppt.end;
        clock = dep;
        dayStops.push({...nextAppt, travelToMin:tTo, arrival:arr, departure:dep});
        pos = nextAppt.lat&&nextAppt.lng ? nextAppt : pos;
        used.add(nextAppt.id);
        continue;
      }

      if(!best) {
        // No customer fits – check if we can still insert any appt
        const remainingAppts = dayAppts.filter(a => !used.has(a.id));
        if(remainingAppts.length > 0) {
          const a = remainingAppts[0];
          clock = a.start; // jump to appt time
          continue;
        }
        break;
      }

      // Check if appt comes before this stop would finish (15min buffer)
      if(nextAppt && !used.has(nextAppt.id)) {
        const tTo = cachedTravelMin(pos, best);
        const dep = clock + tTo + VISIT_MIN_RUNTIME;
        const tToAppt = nextAppt.lat&&nextAppt.lng ? cachedTravelMin(pos, nextAppt) : 0;
        // Trigger early if finishing customer + travel would arrive late or within 15min of appt
        if(dep + tToAppt > nextAppt.start - 15) {
          // Arrive max 15min early, never late
          const earliestArr = clock + tToAppt;
          const arr = earliestArr <= nextAppt.start ? earliestArr : nextAppt.start;
          const apptDep = nextAppt.end;
          clock = apptDep;
          dayStops.push({...nextAppt, travelToMin:tToAppt, arrival:arr, departure:apptDep});
          pos = nextAppt.lat&&nextAppt.lng ? nextAppt : pos;
          used.add(nextAppt.id);
          continue;
        }
      }

      // Add the customer stop
      const tTo  = cachedTravelMin(pos, best);
      const arr  = clock + tTo;
      const dep  = arr + VISIT_MIN_RUNTIME;
      clock = dep;
      dayStops.push({...best, travelToMin:tTo, arrival:arr, departure:dep});
      pos = best;
      used.add(best.id);
      remaining = remaining.filter(r => r.id !== best.id);
    }

    // Force Wednesday end anchor
    if(endAnchor && !used.has(endAnchor.id)) {
      const tTo = cachedTravelMin(pos, endAnchor);
      dayStops.push({...endAnchor, travelToMin:tTo});
      used.add(endAnchor.id);
    }

    if(dayStops.length === 0) continue;

    days.push({ day:di+1, weekDay:wday, stops:dayStops, date:ds });
  }
  return days;
}

// ─── NRW FEIERTAGE ───────────────────────────────────────────────────────────
function getNRWHolidays(year) {
  // Berechne Ostern (Gauss-Algorithmus)
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  const easter = new Date(year, month-1, day, 12);
  const add = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
  const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return new Set([
    year+"-01-01", // Neujahr
    year+"-05-01", // Tag der Arbeit
    year+"-10-03", // Tag der Deutschen Einheit
    year+"-11-01", // Allerheiligen (NRW)
    year+"-12-25", // 1. Weihnachtstag
    year+"-12-26", // 2. Weihnachtstag
    fmt(add(easter,-2)),  // Karfreitag
    fmt(easter),           // Ostersonntag
    fmt(add(easter,1)),   // Ostermontag
    fmt(add(easter,39)),  // Christi Himmelfahrt
    fmt(add(easter,49)),  // Pfingstsonntag
    fmt(add(easter,50)),  // Pfingstmontag
    fmt(add(easter,60)),  // Fronleichnam (NRW)
  ]);
}
function isNRWHoliday(dateStr) {
  const [y] = dateStr.split("-").map(Number);
  return getNRWHolidays(y).has(dateStr);
}

// ─── DISTANCE CACHE (ORS real road distances) ────────────────────────────────
// Cache: "lat1,lng1→lat2,lng2" → minutes
const _distCache = {};

function cacheKey(a, b) {
  // Use 4 decimal places (~11m precision) - matches ORS output precision
  const fmt = n => parseFloat(parseFloat(n).toFixed(4));
  return fmt(a.lat)+","+fmt(a.lng)+"→"+fmt(b.lat)+","+fmt(b.lng);
}

// Track cache usage for debugging
let _cacheHits = 0, _cacheMisses = 0;

function cachedTravelMin(a, b) {
  if(!a || !b || a.lat === undefined || b.lat === undefined) {
    return 15; // default if no coords
  }
  const k = cacheKey(a, b);
  if (_distCache[k] !== undefined) {
    _cacheHits++;
    return _distCache[k];
  }
  _cacheMisses++;
  // Realistic fallback for NRW/Germany (tuned against real Google Maps data):
  // road_distance = straight_line * 1.35
  // avg speed depends on distance category
  const km = distKm(a, b);
  var road = km * 1.35;
  var speed = km < 10 ? 40 : km < 25 ? 65 : km < 50 ? 70 : 80;
  var overhead = km < 10 ? 3 : 5; // parking + start/stop
  return Math.max(5, Math.round((road / speed) * 60 + overhead));
}

function detectCols(headers){
  const map={};
  const fieldOrder=["nr","lat","lng","zip","city","address","name"];
  headers.forEach((h,i)=>{
    const hl=String(h||"").toLowerCase()
      .split("ß").join("ss").split("ä").join("ae").split("ö").join("oe").split("ü").join("ue").split(" ").join("").split("_").join("").split("-").join("").trim();
    for(const f of fieldOrder){
      if(map[f]!==undefined) continue;
      const aliases=COL_ALIASES[f];
      if(aliases.some(a=>{
        const an=a.split("ß").join("ss").split("ä").join("ae").split("ö").join("oe").split("ü").join("ue");
        return hl===an||(an.length>=5&&hl.includes(an))||(hl.length>=5&&an.includes(hl));
      })) map[f]=i;
    }
  });
  return map;
}

async function geocodeAddr(address,city,zip){
  const q=[address,zip,city].filter(Boolean).join(", ")+", Deutschland";
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&q="+encodeURIComponent(q)+"&limit=1",

// ─── FEATURE 1: Besuchsdringlichkeits-Indikator ──────────────────────────────
function visitUrgency(lastVisit) {
  if(!lastVisit) return "red"; // nie besucht
  const days = Math.floor((Date.now() - new Date(lastVisit)) / 86400000);
  if(days > 70) return "red";    // überfällig (>10 Wochen)
  if(days > 56) return "orange"; // bald fällig (8-10 Wochen)
  return "green";                 // frisch besucht (<8 Wochen)
}

// ─── FEATURE 4: GraphHopper Route URL (OSM-basiert, zeigt echte Route) ───────
function graphhopperUrl(stops, startPos) {
  if(!stops || !stops.length) return null;
  const validStops = stops.filter(s => s.lat && s.lng);
  if(!validStops.length) return null;
  const from = startPos || HOME;
  const points = [from, ...validStops, from];
  const params = points.map(p => "point="+p.lat.toFixed(5)+"%2C"+p.lng.toFixed(5)).join("&");
  return "https://graphhopper.com/maps/?" + params + "&vehicle=car&locale=de&elevation=false&use_miles=false";
}

          s.onload = resolve;
          s.onerror = reject;

        });
      }

      // Run OCR on the image
      const { data: { text } } = await window.Tesseract.recognize(
        "data:image/jpeg;base64," + base64img,
        "deu+eng", // German + English
        { logger: () => {} }
      );

      // Parse the OCR text to extract amount, date, category
            const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      const fullText = text.toLowerCase();

      // Extract amount - look for patterns like 12,50 or 12.50 or EUR 12,50
      let amount = "";
      const amtPatterns = [
        /(?:gesamt|total|summe|betrag|zu zahlen|endbetrag)[^\d]*(\d+[,\.]\d{2})/i,
        /(\d+[,\.]\d{2})\s*(?:eur|€)/i,
        /€\s*(\d+[,\.]\d{2})/i,
        /(\d+[,\.]\d{2})/,
      ];
      for(const pat of amtPatterns) {
        const m = text.match(pat);
        if(m) { amount = m[1].replace(",","."); break; }
      }

      // Extract date - look for DD.MM.YYYY or YYYY-MM-DD
      let date = "";
      const datePat = text.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/);
      if(datePat) {
        const d = datePat[1].padStart(2,"0");
        const m = datePat[2].padStart(2,"0");
        const y = datePat[3].length===2 ? "20"+datePat[3] : datePat[3];
        date = y+"-"+m+"-"+d;
      }
      if(!date) {
        const now = new Date();
        date = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
      }

      // Detect category from keywords
      let category = "Sonstiges";
      if(/tankst|diesel|benzin|kraftst|aral|shell|esso|bp |total|jet |star |avia|avanti/i.test(fullText)) category = "Kraftstoff";
      else if(/park|garage|tiefgar|parkhaus|parkschein|parking/i.test(fullText)) category = "Parken";
      else if(/hotel|motel|pension|overnight|unterkunft|zimmer|ibis|novotel|mercure|holiday inn/i.test(fullText)) category = "Hotel";

      // Extract a short note from first meaningful line
      const note = lines.slice(0,3).find(l => l.length > 3 && !/^\d/.test(l)) || "";

      setExpenseForm(f => ({...f,
        amount: amount || "",
        date,
        category,
        note: note.slice(0,40)
      }));

    } catch(e) {
      console.warn("OCR Fehler:", e);
      const now = new Date();
      setExpenseForm(f=>({...f,

  // ── Spontaneous Route from current position ──────────────────────────────
  const buildSpontRoute = useCallback(async () => {
    setSpontLoading(true);
    setShowSpontModal(true);
    setSpontRoute(null);

    // Get current position
    let lat, lng;
    try {
      const pos = await new Promise((resolve, reject) =>
        navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:10000, enableHighAccuracy:true})
      );
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
    } catch(e) {
      setSpontLoading(false);
      setSpontRoute({error: "GPS nicht verfügbar: "+e.message});
      return;
    }

    // Current time in minutes from midnight (use actual current time)
    const now = new Date();
    const currentMin = now.getHours()*60 + now.getMinutes();
    if(currentMin >= WORK_END) {
      setSpontLoading(false);
      setSpontRoute({error:"Arbeitszeit bereits beendet (nach "+Math.floor(WORK_END/60)+":"+String(WORK_END%60).padStart(2,"0")+" Uhr)"});
      return;
    }
    const endMin = WORK_END; // 17:30

    if(currentMin >= endMin - 60) {
      setSpontLoading(false);
      setSpontRoute({error: "Zu wenig Zeit verbleibend (weniger als 1 Stunde)"});
      return;
    }

    const currentPos = {lat, lng};

    // Get already visited stops today
    const todayDayIdx = allDays.findIndex(d => {
      const n = new Date(); n.setHours(0,0,0,0);
      const todayStr = n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
      return d.date === todayStr;
    });
    const visitedToday = new Set(todayDayIdx >= 0 ? (completed["d"+todayDayIdx]||[]) : []);

    // Only customers not visited in the last 60 days
    const SIXTY_DAYS_MS = 60 * 24 * 60 * 60 * 1000;
    const nowMs = Date.now();
    let remaining = locations.filter(l => {
      if(l.fixed || visitedToday.has(l.id)) return false;
      const lv = custData[l.id]?.lastVisit;
      if(!lv) return true;
      return (nowMs - new Date(lv).getTime()) > SIXTY_DAYS_MS;
    });

    // Build nearest-neighbour route from current position
    const stops = [];
    let clock = currentMin;
    let pos = currentPos;

    while(remaining.length > 0 && clock < endMin) {
      // Find nearest
      let best = null, bestTime = Infinity;
      for(const loc of remaining) {
        const t = cachedTravelMin(pos, loc);
        const arr = clock + t;
        const dep = arr + VISIT_MIN_RUNTIME;
        const tBack = cachedTravelMin(loc, HOME);
        if(dep + tBack > endMin) continue; // won't make it back
        if(t < bestTime) { bestTime = t; best = loc; }
      }
      if(!best) break;

      const tTo = cachedTravelMin(pos, best);
      const arr = clock + tTo;
      const dep = arr + VISIT_MIN_RUNTIME;
      clock = dep;
      stops.push({...best, travelToMin: tTo, arrival: arr, departure: dep});
      remaining = remaining.filter(r => r.id !== best.id);
      pos = best;
    }

    setSpontLoading(false);
    setSpontRoute({
      stops, lat, lng,
      fromTime: String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),
      totalKm: stops.reduce((s,st,i) => i===0 ? s+distKm(currentPos,st) : s+distKm(stops[i-1],st), 0).toFixed(1),
      returnMin: stops.length > 0 ? cachedTravelMin(stops[stops.length-1], HOME) : 0,
    });
  }, [locations, allDays, completed, custData]);

  // ── HERE MAPS REAL ROAD DISTANCES (inkrementell) ────────────────────────────
  // onlyNew=true → nur Orte berechnen die noch KEINE Cache-Einträge haben
  const runORSMatrix = useCallback(async (onlyNew=false) => {
    if(!orsKey.trim()){alert("Bitte zuerst den HERE Maps API-Key eintragen.");return;}
    lsSet("ors_key", orsKey.trim());
    setOrsRunning(true);setOrsLog([]);setOrsDone({done:0,total:0,errors:0});

    const allLocs = [HOME, ...locations];
    const n = allLocs.length;
    const log = [];
    let errors = 0, done = 0;

    // Herausfinden welche Orte noch nicht vollständig im Cache sind
    const uncached = onlyNew
      ? allLocs.filter(a => allLocs.some(b => _distCache[cacheKey(a,b)]===undefined))
      : allLocs;

    if(uncached.length===0) {
      log.push({name:"Cache vollständig", status:"ok", type:"Alle Paare bereits vorhanden – nichts zu tun."});
      setOrsLog([...log]);
      setOrsRunning(false);
      return;
    }

    // Wir berechnen: uncached → alle (Zeilen) + alle → uncached (Spalten, falls neue Orte)
    // Durch Symmetrie sparen wir: alle→uncached wird durch uncached→alle fast abgedeckt
    // Daher: origins=uncached, destinations=allLocs → n_uncached × n Paare
    const CHUNK = 100;
    const totalPairsBefore = Object.keys(_distCache).length;
    const totalChunks = Math.ceil(uncached.length / CHUNK);
    const newPairs = uncached.length * n;

    log.push({name:"Start", status:"ok",
      type:uncached.length+" Orte (neu) · "+newPairs+" Paare · "+totalChunks+" Requests"});
    setOrsLog([...log]);

    for(let ci = 0; ci < totalChunks && errors < 3; ci++) {
      const srcStart = ci * CHUNK;
      const srcEnd   = Math.min(srcStart + CHUNK, uncached.length);
      const sources  = uncached.slice(srcStart, srcEnd);
      const originList = sources.map(l=>({lat:parseFloat(parseFloat(l.lat).toFixed(6)),lng:parseFloat(parseFloat(l.lng).toFixed(6))}));
      const destList   = allLocs.map(l=>({lat:parseFloat(parseFloat(l.lat).toFixed(6)),lng:parseFloat(parseFloat(l.lng).toFixed(6))}));

      try {
        const r = await fetch(
          "/api/here-matrix?apiKey="+orsKey.trim()+"&async=false",
          {method:"POST", headers:{"Content-Type":"application/json"},
           body:JSON.stringify({origins:originList,destinations:destList,
             regionDefinition:{type:"autoCircle"},matrixAttributes:["travelTimes"]})}
        );
        if(!r.ok) {
          const txt=await r.text();
          if(r.status===401||r.status===403){log.push({name:"Auth-Fehler",status:"err",type:"API-Key ungültig ("+r.status+")"});errors=99;break;}
          log.push({name:"Chunk "+(ci+1),status:"warn",type:"HTTP "+r.status+": "+txt.slice(0,80)});
          errors++;await new Promise(res=>setTimeout(res,2000));continue;
        }
        const data=await r.json();
        const matrix=data.matrix;
        let pairs=0;
        if(matrix&&matrix.travelTimes) {
          const numDest=matrix.numDestinations||n;
          for(let a=0;a<sources.length;a++) {
            for(let b=0;b<allLocs.length;b++) {
              const secs=matrix.travelTimes[a*numDest+b];
              if(secs!==null&&secs!==undefined&&secs>=0) {
                // Beide Richtungen cachen (Fahrzeit A→B ≈ B→A, spart 50% bei nächster Berechnung)
                _distCache[cacheKey(sources[a],allLocs[b])]=Math.max(1,Math.ceil(secs/60));
                if(_distCache[cacheKey(allLocs[b],sources[a])]===undefined)
                  _distCache[cacheKey(allLocs[b],sources[a])]=Math.max(1,Math.ceil(secs/60));
                pairs++;
              }
            }
          }
        }
        done+=sources.length;
        log.push({name:"Chunk "+(ci+1)+"/"+totalChunks,status:"ok",type:pairs+" Paare · "+sources.length+"x"+n});
        setOrsDone({done,total:uncached.length,errors});
        setOrsLog([...log]);
        if(ci+1<totalChunks) await new Promise(res=>setTimeout(res,500));
      } catch(e) {
        log.push({name:"Netzwerk",status:"err",type:e.message});
        errors++;await new Promise(res=>setTimeout(res,2000));
      }
    }

    const totalPairsAfter=Object.keys(_distCache).length;
    log.push({name:"Fertig",status:errors>0?"warn":"ok",
      type:totalPairsAfter+" Paare gespeichert (+"+(totalPairsAfter-totalPairsBefore)+" neu)"+(errors>0?" ("+errors+" Fehler)":"")});
    setOrsLog([...log]);
    lsSet("ors_cache",_distCache);
    setOrsRunning(false);
    setOrsDone({done:uncached.length,total:uncached.length,errors});
    setDistCacheVer(v=>v+1);
    setReplanKey(k=>k+1);
  }, [orsKey, locations]);

  const runBatchGeocode=useCallback(async()=>{
    if(!apiKey.trim()){alert("Bitte zuerst den Google API-Key eintragen.");return;}
    lsSet("gmaps_key",apiKey.trim());
    setGcRunning(true);setGcLog([]);setGcDone({done:0,total:locations.length,errors:0});
    const GMAPS="https://maps.googleapis.com/maps/api/geocode/json";
    const updated=[],log=[];let errors=0;
    for(let i=0;i<locations.length;i++){
      const loc=locations[i];
      // Bereits geocodiert – überspringen (spart Google-API-Kosten)
      if(loc.lat&&loc.lng&&!isNaN(parseFloat(loc.lat))&&!isNaN(parseFloat(loc.lng))){
        updated.push(loc);
        setGcDone({done:i+1,total:locations.length,errors});
        continue;
      }
      const addr=[loc.address,loc.zip,loc.city,"Deutschland"].filter(Boolean).join(", ");
      try{
        const r=await fetch(GMAPS+"?address="+encodeURIComponent(addr)+"&key="+apiKey.trim()+"&region=de&language=de");
        const d=await r.json();
        if(d.status==="OK"){
          const res=d.results[0];
          updated.push({...loc,lat:res.geometry.location.lat,lng:res.geometry.location.lng});
          log.push({name:loc.name,status:"ok",type:res.geometry.location_type});
        } else if(d.status==="REQUEST_DENIED"){
          log.push({name:loc.name,status:"err",type:"API-KEY UNGÜLTIG"});
          updated.push(loc);errors++;break;
        } else {updated.push(loc);errors++;log.push({name:loc.name,status:"warn",type:d.status});}
      }catch(e){updated.push(loc);errors++;log.push({name:loc.name,status:"err",type:"Verbindungsfehler"});}
      setGcLog([...log]);setGcDone({done:i+1,total:locations.length,errors});
      await new Promise(r=>setTimeout(r,50));
    }
    setLocationsRaw(prev=>{
      lsSet("locs",updated);

      {/* HEADER */}

                      <div style={{padding:"13px 16px"}}>
                        <div style={{fontSize:12,color:"#8E8E93",fontWeight:600,fontFamily:"-apple-system,sans-serif",marginBottom:10,letterSpacing:.3}}>WASSERQUALITÄT</div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                          <div>
                            <div style={{fontSize:11,color:"#8E8E93",fontFamily:"-apple-system,sans-serif",marginBottom:4}}>GH (°dH)</div>
                            <input type="number" min="0" step="0.1" placeholder="z.B. 14"
                              value={panelGH} onChange={e=>{setPanelGH(e.target.value);setCustData(cd=>({...cd,[panel.id]:{...(cd[panel.id]||{}),waterGH:e.target.value}}));}}
                              style={{width:"100%",border:"1px solid #E5E5EA",borderRadius:8,padding:"9px 10px",fontSize:14,fontFamily:"-apple-system,sans-serif",color:"#1C1C1E"}}/>
                          </div>
                          <div>
                            <div style={{fontSize:11,color:"#8E8E93",fontFamily:"-apple-system,sans-serif",marginBottom:4}}>KH (°dH)</div>
                            <input type="number" min="0" step="0.1" placeholder="z.B. 8"
                              value={panelKH} onChange={e=>{setPanelKH(e.target.value);setCustData(cd=>({...cd,[panel.id]:{...(cd[panel.id]||{}),waterKH:e.target.value}}));}}
                              style={{width:"100%",border:"1px solid #E5E5EA",borderRadius:8,padding:"9px 10px",fontSize:14,fontFamily:"-apple-system,sans-serif",color:"#1C1C1E"}}/>
                          </div>
                          <div>
                            <div style={{fontSize:11,color:"#8E8E93",fontFamily:"-apple-system,sans-serif",marginBottom:4}}>Filterkopf</div>
                            <input type="number" min="0" step="1" placeholder="z.B. 3"
                              value={panelFilterHead} onChange={e=>{setPanelFilterHead(e.target.value);setCustData(cd=>({...cd,[panel.id]:{...(cd[panel.id]||{}),filterHead:e.target.value}}));}}
                              style={{width:"100%",border:"1px solid #E5E5EA",borderRadius:8,padding:"9px 10px",fontSize:14,fontFamily:"-apple-system,sans-serif",color:"#1C1C1E"}}/>
                          </div>
                        </div>
                      </div>
                    </>
                  )}
                </div>
              </div>
              {/* GPS position */}
              <div style={{padding:"0 16px 14px"}}>
                <div style={{fontSize:11,...amber,fontWeight:600,marginBottom:8}}>📍 GPS-Position</div>
                <div style={{background:"#FFFFFF",border:"1px solid #E5E5EA",borderRadius:10,padding:"11px 13px",marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <div style={{fontSize:11,...dim}}>Aktuelle Koordinaten</div>
                    <a href={"https://www.google.com/maps?q="+panel.lat+","+panel.lng} target="_blank" rel="noopener noreferrer"
                      style={{fontSize:10,...amber,border:"1px solid #007AFF44",borderRadius:4,padding:"2px 8px"}}>In Maps prüfen ↗</a>
                  </div>
                  <div style={{fontSize:12,color:"#1C1C1E",fontFamily:"monospace"}}>{panel.lat?.toFixed(10)}, {panel.lng?.toFixed(10)}</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:7,marginBottom:8}}>
                  <div><div style={{fontSize:10,...dim,marginBottom:4}}>Latitude (neu)</div>
                    <input id={"lat_"+panel.id} placeholder={String(panel.lat?.toFixed(10)||"")}
                      style={{width:"100%",background:"#FFFFFF",border:"1px solid #E5E5EA",borderRadius:6,padding:"7px 9px",fontSize:12}}/>
                  </div>
                  <div><div style={{fontSize:10,...dim,marginBottom:4}}>Longitude (neu)</div>
                    <input id={"lng_"+panel.id} placeholder={String(panel.lng?.toFixed(10)||"")}
                      style={{width:"100%",background:"#FFFFFF",border:"1px solid #E5E5EA",borderRadius:6,padding:"7px 9px",fontSize:12}}/>
                  </div>
                  <div style={{display:"flex",alignItems:"flex-end"}}>
                    <button className="btn" onClick={()=>{
                      const latEl=document.getElementById("lat_"+panel.id);
                      const lngEl=document.getElementById("lng_"+panel.id);
                      const lv=latEl?.value?.trim(),gv=lngEl?.value?.trim();
                      if(lv&&gv){setManualCoords(lv,gv,panel.id);if(latEl)latEl.value="";if(lngEl)lngEl.value="";}
                      else alert("Bitte beide Felder ausfüllen");
                    }} style={{background:"#007AFF",color:"#FFFFFF",borderRadius:6,padding:"7px 12px",fontWeight:700,fontSize:12,...SG,height:32}}>✓</button>
                  </div>
                </div>
                <div style={{fontSize:10,color:"#8E8E93",lineHeight:1.7}}>💡 Google Maps: rechtsklick auf Punkt → Koordinaten kopieren</div>
              </div>
              <div style={{padding:"0 16px 14px"}}>
                <div style={{fontSize:11,...amber,fontWeight:600,marginBottom:7}}>📝 Kundennotiz</div>
                <textarea value={panelNote} onChange={e=>setPanelNote(e.target.value)} placeholder="Besonderheiten, Ansprechpartner, Hinweise…"
                  style={{width:"100%",minHeight:80,background:"#FFFFFF",border:"1px solid #E5E5EA",borderRadius:10,padding:"9px 11px",fontSize:12,resize:"vertical",lineHeight:1.6}}/>
              </div>
              <div style={{padding:"0 16px 14px"}}>
                <div style={{fontSize:11,...amber,fontWeight:600,marginBottom:7}}>🔧 Equipment</div>
                <textarea value={panelEquipment} onChange={e=>setPanelEquipment(e.target.value)} placeholder="Geräte vor Ort (z.B. Kaffeemaschine XY, Mühle ABC…)"
                  style={{width:"100%",minHeight:70,background:"#FFFFFF",border:"1px solid #E5E5EA",borderRadius:10,padding:"9px 11px",fontSize:12,resize:"vertical",lineHeight:1.6}}/>
              </div>
              <div style={{padding:"0 16px 14px"}}>
                <div style={{fontSize:11,...amber,fontWeight:600,marginBottom:8}}>Getaetigte Aufgaben</div>
                {panelTasks.length===0&&<div style={{fontSize:11,color:"#8E8E93",fontStyle:"italic",marginBottom:8}}>Noch keine Aufgaben.</div>}
                {panelTasks.map(t=>(
                  <div key={t.id} style={{display:"flex",alignItems:"center",gap:9,padding:"6px 0",borderBottom:"1px solid #E5E5EA"}}>
                    <button className="btn" onClick={()=>toggleTask(t.id)} style={{width:20,height:20,borderRadius:4,border:"2px solid "+(t.done?"#4ade80":"#E5E5EA"),background:t.done?"#4ade80":"transparent",color:"#000",fontSize:11,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{t.done&&"✓"}</button>
                    <span style={{fontSize:12,color:t.done?"#4ade80":"#1C1C1E",textDecoration:t.done?"line-through":"none",flex:1}}>{t.label}</span>
                    <button className="btn" onClick={()=>removeTask(t.id)} style={{background:"none",color:"#8E8E93",fontSize:11,padding:"2px 5px"}}>✕</button>
                  </div>
                ))}
                <div style={{display:"flex",gap:7,marginTop:9}}>
                  <input value={taskInput} onChange={e=>setTaskInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTask()} placeholder="Neue Aufgabe…"
                    style={{flex:1,background:"#FFFFFF",border:"1px solid #E5E5EA",borderRadius:10,padding:"7px 10px",fontSize:12}}/>
                  <button className="btn" onClick={addTask} style={{background:"#007AFF",color:"#FFFFFF",borderRadius:10,padding:"7px 14px",fontWeight:600,fontSize:12,...SG}}>+ Add</button>
                </div>
              </div>
              <div style={{padding:"0 16px 14px"}}>
                <div style={{fontSize:11,...amber,fontWeight:600,marginBottom:7}}>✅ Besuch dokumentieren</div>
                <textarea value={panelVisNote} onChange={e=>setPanelVisNote(e.target.value)} placeholder="Was wurde heute erledigt?"
                  style={{width:"100%",minHeight:65,background:"#FFFFFF",border:"1px solid #E5E5EA",borderRadius:10,padding:"9px 11px",fontSize:12,resize:"vertical",lineHeight:1.6,marginBottom:9}}/>
                <button className="btn" onClick={()=>{saveNote();saveVisit();}} style={{width:"100%",background:"#007AFF",color:"#FFFFFF",borderRadius:12,padding:"11px",...SG,fontWeight:700,fontSize:14}}>✅ Besuch + Notiz speichern</button>
              </div>
              {/* ── BESUCHSHISTORIE ── */}
              <div style={{padding:"0 16px 16px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontSize:11,color:"#007AFF",fontWeight:600,...SG}}>🕐 Besuchshistorie</div>
                  <button className="btn" onClick={()=>{
                    const n=new Date();
                    setAddHistDate(n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"));
                    setAddHistNote("");setAddHistMode(true);
                  }} style={{background:"#007AFF",color:"#FFFFFF",borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:600,border:"none"}}>
                    + Eintrag
                  </button>
                </div>

                {/* Add new entry form */}
                {addHistMode&&(
                  <div style={{background:"#F0F8FF",border:"1px solid #C0DFFF",borderRadius:12,padding:"12px",marginBottom:12}}>
                    <div style={{fontSize:11,color:"#007AFF",fontWeight:600,marginBottom:8,...SG}}>Neuer Eintrag</div>
                    <div style={{display:"flex",gap:8,marginBottom:8}}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,...SG}}>DATUM</div>
                        <input type="date" value={addHistDate} onChange={e=>setAddHistDate(e.target.value)}
                          style={{width:"100%",fontSize:14,border:"1px solid #E5E5EA",borderRadius:8,padding:"6px 8px",background:"#FFFFFF"}}/>
                      </div>
                    </div>
                    <div style={{marginBottom:10}}>
                      <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,...SG}}>NOTIZ</div>
                      <textarea value={addHistNote} onChange={e=>setAddHistNote(e.target.value)}
                        placeholder="Gesprächsthemen, Ergebnis..."
                        style={{width:"100%",fontSize:14,border:"1px solid #E5E5EA",borderRadius:8,padding:"8px",minHeight:60,resize:"none",background:"#FFFFFF"}}/>
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button className="btn" onClick={()=>{
                        if(!addHistDate) return;
                        setCustData(cd=>{
                          const cur=cd[panel.id]||{};
                          const hist=[{date:addHistDate,note:addHistNote,tasks:[]},...(cur.visitHistory||[])];
                          hist.sort((a,b)=>b.date.localeCompare(a.date));
                          return {...cd,[panel.id]:{...cur,visitHistory:hist.slice(0,50),lastVisit:hist[0].date}};
                        });
                        setAddHistMode(false);
                      }} style={{flex:1,background:"#007AFF",color:"#FFFFFF",border:"none",borderRadius:8,padding:"9px",fontSize:13,fontWeight:600}}>Speichern</button>
                      <button className="btn" onClick={()=>setAddHistMode(false)}
                        style={{background:"#F2F2F7",color:"#8E8E93",border:"none",borderRadius:8,padding:"9px 14px",fontSize:13}}>Abbrechen</button>
                    </div>
                  </div>
                )}

                {!(custData[panel.id]?.visitHistory?.length)&&!addHistMode&&(
                  <div style={{fontSize:11,color:"#8E8E93",fontStyle:"italic",...SG}}>Noch keine Besuche.</div>
                )}

                {(custData[panel.id]?.visitHistory||[]).map((v,i)=>(
                  <div key={i} style={{background:"#FFFFFF",border:"1px solid #E5E5EA",borderRadius:12,padding:"11px 14px",marginBottom:8}}>
                    {editHistIdx===i ? (
                      /* Edit mode */
                      <div>
                        <textarea value={editHistNote} onChange={e=>setEditHistNote(e.target.value)}
                          style={{width:"100%",fontSize:14,border:"1px solid #007AFF",borderRadius:8,padding:"8px",minHeight:60,resize:"none",marginBottom:8}}/>
                        <div style={{display:"flex",gap:8}}>
                          <button className="btn" onClick={()=>{
                            setCustData(cd=>{
                              const cur=cd[panel.id]||{};
                              const hist=(cur.visitHistory||[]).map((h,j)=>j===i?{...h,note:editHistNote}:h);
                              return {...cd,[panel.id]:{...cur,visitHistory:hist}};
                            });
                            setEditHistIdx(null);
                          }} style={{flex:1,background:"#007AFF",color:"#FFFFFF",border:"none",borderRadius:8,padding:"7px",fontSize:13,fontWeight:600}}>Speichern</button>
                          <button className="btn" onClick={()=>setEditHistIdx(null)}
                            style={{background:"#F2F2F7",color:"#8E8E93",border:"none",borderRadius:8,padding:"7px 12px",fontSize:13}}>Abbrechen</button>
                        </div>
                      </div>
                    ) : (
                      /* View mode */
                      <>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:v.note?4:0}}>
                          <div style={{...SG,fontWeight:600,fontSize:13,color:"#1C1C1E"}}>{fmtDate(v.date)}</div>
                          <div style={{display:"flex",gap:6,alignItems:"center"}}>
                            {i===0&&<span style={{fontSize:9,background:"#007AFF22",color:"#007AFF",borderRadius:5,padding:"1px 7px",...SG}}>Letzter</span>}
                            <button className="btn" onClick={()=>{setEditHistIdx(i);setEditHistNote(v.note||"");}}
                              style={{background:"rgba(0,122,255,.1)",color:"#007AFF",border:"none",borderRadius:6,padding:"4px 9px",fontSize:12,fontWeight:600}}>✏</button>
                            <button className="btn" onClick={()=>{
                              setCustData(cd=>{
                                const cur=cd[panel.id]||{};
                                const hist=(cur.visitHistory||[]).filter((_,j)=>j!==i);
                                return {...cd,[panel.id]:{...cur,visitHistory:hist,lastVisit:hist[0]?.date||""}};
                              });
                            }} style={{background:"rgba(255,59,48,.1)",color:"#FF3B30",border:"none",borderRadius:6,padding:"4px 9px",fontSize:12,fontWeight:600}}>✕</button>
                          </div>
                        </div>
                        {v.note&&<div style={{fontSize:12,color:"#8E8E93",lineHeight:1.5,...SG}}>{v.note}</div>}
                        {v.tasks?.filter(t=>t.done).length>0&&(
                          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:4}}>
                            {v.tasks.filter(t=>t.done).map((t,j)=><span key={j} style={{fontSize:9,background:"rgba(52,199,89,.08)",color:"#34C759",borderRadius:4,padding:"1px 6px",border:"1px solid rgba(52,199,89,.15)"}}>✓ {t.label}</span>)}
                          </div>
                        )}
                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ══ APPOINTMENT MODAL ══ */}
      {showAppt&&(
        <div style={{position:"fixed",inset:0,zIndex:600,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.4)"}} onClick={()=>{setShowAppt(false);setApptErr("");}}/>
          <div style={{position:"relative",background:"#F2F2F7",borderRadius:"20px 20px 0 0",padding:"0 0 env(safe-area-inset-bottom,20px)",width:"100%",maxWidth:540,zIndex:1,maxHeight:"92vh",display:"flex",flexDirection:"column",boxShadow:"0 -10px 40px rgba(0,0,0,.15)"}}>

            {/* Handle */}
            <div style={{display:"flex",justifyContent:"center",padding:"12px 0 4px"}}>
              <div style={{width:36,height:4,background:"#C7C7CC",borderRadius:2}}/>
            </div>

            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 20px 16px",background:"rgba(255,255,255,0.9)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderBottom:"0.5px solid #E5E5EA"}}>
              <button className="btn" onClick={()=>{setShowAppt(false);setApptErr("");setEditAppt(null);setApptForm({date:"",startTime:"",endTime:"",customerNr:"",title:"",note:"",address:"",zip:"",city:"",lat:null,lng:null,locationId:null});}}
                style={{color:"#FF3B30",background:"none",fontSize:16,fontWeight:500,fontFamily:"-apple-system,sans-serif"}}>Abbrechen</button>
              <div style={{fontSize:16,fontWeight:700,color:"#1C1C1E",fontFamily:"-apple-system,sans-serif"}}>{editAppt?"✏ Termin bearbeiten":"📅 Neuer Termin"}</div>
              <button className="btn" onClick={saveAppt}
                style={{color:"#007AFF",background:"none",fontSize:16,fontWeight:600,fontFamily:"-apple-system,sans-serif"}}>Sichern</button>
            </div>

            <div style={{overflowY:"auto",flex:1,WebkitOverflowScrolling:"touch"}}>

              {/* ── Alle Felder in einer kompakten iOS-Liste ── */}
              <div style={{background:"#FFFFFF",margin:"12px 16px",borderRadius:12,
                boxShadow:"0 1px 3px rgba(0,0,0,.08)",overflow:"hidden"}}>

                {/* Kundennummer */}
                {(()=>{
                  const loc=locations.find(l=>l.nr===apptForm.customerNr.trim());
                  return (
                    <div style={{padding:"11px 14px",borderBottom:"0.5px solid #E5E5EA"}}>
                      <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,fontFamily:"-apple-system,sans-serif"}}>KUNDENNUMMER</div>
                      <input value={apptForm.customerNr}
                        onChange={e=>{
                          const nr=e.target.value.trim();
                          const l=locations.find(x=>x.nr===nr);
                          if(l){setApptForm(f=>({...f,customerNr:e.target.value,title:f.title||l.name,address:l.address||"",zip:l.zip||"",city:l.city||"",lat:l.lat,lng:l.lng,locationId:l.id}));}
                          else{setApptForm(f=>({...f,customerNr:e.target.value,address:"",zip:"",city:"",lat:null,lng:null,locationId:null}));}
                        }}
                        placeholder="z.B. 21882"
                        style={{width:"100%",fontSize:15,border:"none",background:"transparent",color:"#1C1C1E",fontFamily:"-apple-system,sans-serif",padding:0}}/>
                      {loc&&<div style={{fontSize:12,color:"#34C759",marginTop:2,fontFamily:"-apple-system,sans-serif"}}>✓ {loc.name}</div>}
                    </div>
                  );
                })()}

                {/* Titel */}
                <div style={{padding:"11px 14px",borderBottom:"0.5px solid #E5E5EA"}}>
                  <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,fontFamily:"-apple-system,sans-serif"}}>TITEL</div>
                  <input value={apptForm.title} onChange={e=>setApptForm(f=>({...f,title:e.target.value}))}
                    placeholder="z.B. Jahresgespräch / Wartung"
                    style={{width:"100%",fontSize:15,border:"none",background:"transparent",color:"#1C1C1E",fontFamily:"-apple-system,sans-serif",padding:0}}/>
                </div>

                {/* Datum */}
                <div style={{padding:"11px 14px",borderBottom:"0.5px solid #E5E5EA",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:15,color:"#1C1C1E",fontFamily:"-apple-system,sans-serif"}}>Datum</div>
                  <input type="date" value={apptForm.date} onChange={e=>setApptForm(f=>({...f,date:e.target.value}))}
                    style={{fontSize:15,border:"none",background:"transparent",color:"#007AFF",fontFamily:"-apple-system,sans-serif",fontWeight:500,padding:0}}/>
                </div>

                {/* Beginn */}
                <div style={{padding:"11px 14px",borderBottom:"0.5px solid #E5E5EA",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:15,color:"#1C1C1E",fontFamily:"-apple-system,sans-serif"}}>Beginn</div>
                  <input type="time" value={apptForm.startTime} onChange={e=>setApptForm(f=>({...f,startTime:e.target.value}))}
                    style={{fontSize:15,border:"none",background:"transparent",color:"#007AFF",fontFamily:"-apple-system,sans-serif",fontWeight:500,padding:0}}/>
                </div>

                {/* Ende */}
                <div style={{padding:"11px 14px",borderBottom:"0.5px solid #E5E5EA",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:15,color:"#1C1C1E",fontFamily:"-apple-system,sans-serif"}}>Ende</div>
                  <input type="time" value={apptForm.endTime} onChange={e=>setApptForm(f=>({...f,endTime:e.target.value}))}
                    style={{fontSize:15,border:"none",background:"transparent",color:"#007AFF",fontFamily:"-apple-system,sans-serif",fontWeight:500,padding:0}}/>
                </div>

                {/* Straße */}
                <div style={{padding:"11px 14px",borderBottom:"0.5px solid #E5E5EA"}}>
                  <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,fontFamily:"-apple-system,sans-serif"}}>STRASSE & HAUSNUMMER</div>
                  <input value={apptForm.address} onChange={e=>setApptForm(f=>({...f,address:e.target.value}))}
                    placeholder="z.B. Hauptstraße 12"
                    style={{width:"100%",fontSize:15,border:"none",background:"transparent",color:"#1C1C1E",fontFamily:"-apple-system,sans-serif",padding:0}}/>
                </div>

                {/* PLZ + Stadt in einer Zeile */}
                <div style={{padding:"11px 14px",borderBottom:"0.5px solid #E5E5EA",display:"flex",gap:12}}>
                  <div style={{width:80,flexShrink:0}}>
                    <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,fontFamily:"-apple-system,sans-serif"}}>PLZ</div>
                    <input value={apptForm.zip} onChange={e=>setApptForm(f=>({...f,zip:e.target.value}))}
                      placeholder="33098"
                      style={{width:"100%",fontSize:15,border:"none",background:"transparent",color:"#1C1C1E",fontFamily:"-apple-system,sans-serif",padding:0}}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,fontFamily:"-apple-system,sans-serif"}}>STADT</div>
                    <input value={apptForm.city} onChange={e=>setApptForm(f=>({...f,city:e.target.value}))}
                      placeholder="z.B. Paderborn"
                      style={{width:"100%",fontSize:15,border:"none",background:"transparent",color:"#1C1C1E",fontFamily:"-apple-system,sans-serif",padding:0}}/>
                  </div>
                </div>

                {/* Lat + Lng in einer Zeile */}
                <div style={{padding:"11px 14px",borderBottom:"0.5px solid #E5E5EA",display:"flex",gap:12}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,fontFamily:"-apple-system,sans-serif"}}>LATITUDE</div>
                    <input
                      value={apptForm.lat!==null&&apptForm.lat!==undefined?String(apptForm.lat):""}
                      onChange={e=>setApptForm(f=>({...f,lat:e.target.value===""?null:parseFloat(e.target.value.replace(",",".")),locationId:null}))}
                      placeholder="51.71890"
                      style={{width:"100%",fontSize:14,border:"none",background:"transparent",color:apptForm.lat?"#007AFF":"#8E8E93",fontFamily:"monospace",padding:0}}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:10,color:"#8E8E93",marginBottom:3,fontFamily:"-apple-system,sans-serif"}}>LONGITUDE</div>

            ["Überstunden Vormonat",fmtHHMM(ueVorMins)],
            ["Überstunden diesen Monat",fmtHHMM(ueMonat)],
            ["ÜE-Abbau Tage","-"+fmtHHMM(ueAbbauMins)],
            ["Abgefeierte Überstunden",fmtHHMM(abgefeiertMins)],
            ["GESAMT ÜBERSTUNDEN ÜBRIG",fmtHHMM(ueGesamt)]
          ];
          const bottomRows=skBlock.map((r,i)=>[...r,"",...(ueBlock[i]||["",""])]);
          const gesRow=["","","","","","SPESEN GESAMT",fmtEur(spesenGesamt)];
          const allRows=[
            ["REISEKOSTEN ABRECHNUNG ADRIANO FALCONE"],
            [monatsName],[],
            header,...dataRows,sumRow,
            [],...bottomRows,[],gesRow
          ];
          const ws=XLSX.utils.aoa_to_sheet(allRows);
          ws["!cols"]=[{wch:24},{wch:8},{wch:8},{wch:26},{wch:8},{wch:8},{wch:18}];
          const wb=XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb,ws,"Spesenabrechnung");
          XLSX.writeFile(wb,"Spesen_"+monatsName.replace(" ","_")+".xlsx");
          lsSet("ue_saved_"+spesenMonth,ueGesamt);
          setShowSpesenExport(false);
        };

        const exportPdf=()=>{
          const {dataRows,sumRow}=buildExportData();
          // Row colors matching original: green=Geschäftsreise, orange=Feiertag, grey=Urlaub
          const pdfRowBg=r=>r.isFeiertag?"#FFE0B2":r.isUrlaub?"#F5F5F5":r.isKrank?"#BBDEFB":r.isUeAbbau?"#E1BEE7":"#E8F5E8";
          const pdfRowColor=r=>r.isFeiertag?"#BF360C":r.isUrlaub?"#757575":r.isKrank?"#0D47A1":r.isUeAbbau?"#4A148C":"#1C1C1E";
          const pdfRowFont=r=>r.isSpecialDay?"normal":"bold";
          const tableRows=rows.map((r,i)=>{
            const dr=dataRows[i];
            const bg=pdfRowBg(r); const col=pdfRowColor(r); const fw=pdfRowFont(r);
            return `<tr style="background:${bg}">
              <td style="font-weight:${fw};color:${col}">${dr[0]}</td>
              <td>${dr[1]}</td><td>${dr[2]}</td>
              <td style="font-weight:bold;color:${col}">${dr[3]}</td>
              <td>${dr[4]}</td><td>${dr[5]}</td>
              <td>${(parseFloat(r.verpflegung)||0)>0?fmtEur(r.verpflegung):"0,00 €"}</td>
            </tr>`;
          }).join("");
          const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spesen ${monatsName}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
@page{size:A4 portrait;margin:10mm}
body{font-family:Arial,Helvetica,sans-serif;font-size:9pt;color:#1C1C1E}
.title-box{background:#1a3a5a;color:#fff;text-align:center;padding:8px 4px 4px;border-radius:4px 4px 0 0;font-size:12pt;font-weight:bold;letter-spacing:.5px}
.month-box{background:#1a3a5a;color:#fff;text-align:center;padding:4px;border-radius:0 0 4px 4px;font-size:10pt;margin-bottom:10px}
table.main{width:100%;border-collapse:collapse;margin-bottom:10px;border:1px solid #ccc}
table.main th{background:#1a3a5a;color:#fff;padding:5px 6px;text-align:left;font-size:8pt;font-weight:bold;border-right:1px solid #2a4a6a}
table.main td{padding:4px 6px;border-bottom:1px solid #ddd;border-right:1px solid #ddd;font-size:8.5pt;vertical-align:middle}
table.main tr.sum td{background:#1a3a5a;color:#fff;font-weight:bold}
.bottom{display:flex;gap:12px;margin-bottom:10px}
.box{flex:1;border:1px solid #ccc;border-radius:3px;overflow:hidden}
.box-title{background:#1a3a5a;color:#fff;padding:5px 8px;font-size:8pt;font-weight:bold}
table.sub{width:100%;border-collapse:collapse}
table.sub td{padding:4px 8px;border-bottom:1px solid #eee;font-size:8.5pt}
table.sub td:last-child{text-align:right;font-weight:500}
table.sub tr.total td{background:#1a3a5a;color:#fff;font-weight:bold}
.gesamt-row{display:flex;justify-content:flex-end;align-items:center;gap:20px;background:#1a3a5a;color:#fff;padding:8px 14px;border-radius:3px;font-size:11pt;font-weight:bold}
.legend{margin-top:8px;font-size:7pt;color:#555;line-height:1.9}
.leg-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
</style></head><body>
<div class="title-box">REISEKOSTEN ABRECHNUNG ADRIANO FALCONE</div>
<div class="month-box">${monatsName}</div>
<table class="main"><thead><tr>
  <th>DATUM</th><th>REISE BEGINN</th><th>REISE ENDE</th><th>REISEORT</th><th>DAUER</th><th>SOLL ST.</th><th>VERPFLEGUNG PAUSCHAL</th>
</tr></thead><tbody>
${tableRows}
<tr class="sum"><td colspan="4">SUMMEN MONAT</td><td>${sumRow[4]}</td><td>${sumRow[5]}</td><td>${fmtEur(totalVerpf)}</td></tr>
</tbody></table>
<div class="bottom">
  <div class="box">
    <div class="box-title">SONSTIGE KOSTEN</div>
    <table class="sub">
      <tr><td>Diesel</td><td>${fmtEur(diesel)}</td></tr>
      <tr><td>Parken</td><td>${fmtEur(parken)}</td></tr>
      <tr><td>Hotel</td><td>${fmtEur(hotel)}</td></tr>
      <tr><td>Sonstiges</td><td>${fmtEur(sonstiges)}</td></tr>
      <tr class="total"><td>GESAMT SONSTIGE KOSTEN</td><td>${fmtEur(gesamtSonstige)}</td></tr>
    </table>
  </div>
  <div class="box">
    <div class="box-title">ÜBERSTUNDEN ÜBERSICHT</div>
    <table class="sub">
      <tr><td>Überstunden Vormonat</td><td>${fmtHHMM(ueVorMins)}</td></tr>
      <tr><td>Überstunden diesen Monat</td><td>${fmtHHMM(ueMonat)}</td></tr>
      <tr><td>ÜE-Abbau Tage</td><td>−${fmtHHMM(ueAbbauMins)}</td></tr>
      <tr><td>Abgefeierte Überstunden</td><td>${fmtHHMM(abgefeiertMins)}</td></tr>
      <tr class="total"><td>GESAMT ÜBERSTUNDEN ÜBRIG</td><td>${fmtHHMM(ueGesamt)}</td></tr>
    </table>
  </div>
</div>
<div class="gesamt-row"><span>SPESEN GESAMT</span><span>${fmtEur(spesenGesamt)}</span></div>
<div class="legend">
  <span class="leg-dot" style="background:#4CAF50"></span>Grün = Arbeit &nbsp;|&nbsp;
  <span class="leg-dot" style="background:#FF9800"></span>Orange = Feiertag &nbsp;|&nbsp;
  <span class="leg-dot" style="background:#E0E0E0"></span>Grau = Urlaub &nbsp;|&nbsp;
  <span class="leg-dot" style="background:#90CAF9"></span>Blau = Krank &nbsp;|&nbsp;
  <span class="leg-dot" style="background:#CE93D8"></span>Lila = ÜE-Abbau &nbsp;|&nbsp;
  Verpflegung: 14 € ab 8h Arbeitszeit
</div>
</body></html>`;
          const w=window.open("","_blank");w.document.write(html);w.document.close();
          setTimeout(()=>w.print(),500);
          lsSet("ue_saved_"+spesenMonth,ueGesamt);
          setShowSpesenExport(false);
        };

        return (
          <div key="spesen-modal" style={{position:"fixed",inset:0,zIndex:800,display:"flex",flexDirection:"column",background:"#F2F2F7"}}>
            {/* Header */}
            <div style={{background:"#1a3a5a",color:"#fff",padding:"12px 12px",display:"flex",alignItems:"center",gap:8,flexShrink:0,flexWrap:"wrap"}}>
              <button className="btn" onClick={()=>setShowSpesen(false)} style={{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",borderRadius:8,padding:"6px 11px",fontSize:14,flexShrink:0}}>✕</button>
              <div style={{flex:1,minWidth:80}}>
                <div style={{fontSize:15,fontWeight:700}}>📋 Spesenabrechnung</div>
                <div style={{fontSize:10,opacity:.75}}>Adriano Falcone</div>
              </div>
              <select value={spesenMonth} onChange={e=>setSpesenMonth(e.target.value)}
                style={{background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.3)",color:"#fff",borderRadius:8,padding:"6px 8px",fontSize:12,flexShrink:0}}>
                {Array.from({length:18},(_,i)=>{const d=new Date();d.setMonth(d.getMonth()-i);const v=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");return(<option key={v} value={v} style={{color:"#1C1C1E"}}>{d.toLocaleDateString("de-DE",{month:"short",year:"numeric"})}</option>);}).reverse()}
              </select>
              <button className="btn" onClick={()=>setShowSpesenExport(true)}
                style={{background:"#34C759",border:"none",color:"#fff",borderRadius:8,padding:"7px 14px",fontSize:13,fontWeight:700,flexShrink:0}}>
                ↑ Export
              </button>
            </div>

            {/* Scrollable body – height:0 is the iOS fix */}
            <div style={{flex:1,height:0,overflowY:"scroll",WebkitOverflowScrolling:"touch",padding:"10px 8px"}}>

              {/* Haupttabelle – horizontal scrollbar on mobile */}
              <div style={{background:"#fff",borderRadius:12,overflow:"hidden",marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,.08)"}}>
                <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
                  <table style={{borderCollapse:"collapse",fontSize:11,whiteSpace:"nowrap"}}>
                    <thead>
                      <tr style={{background:"#1a3a5a",color:"#fff"}}>
                        {["DATUM","BEGINN","ENDE","REISEORT","DAUER","SOLL","VERPFL."].map(h=>(
                          <th key={h} style={{padding:"7px 6px",textAlign:"left",fontSize:9,fontWeight:700,letterSpacing:.3}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map(r=>(
                        <tr key={r.dateStr} style={{background:rowBg(r),borderBottom:"1px solid #F2F2F7"}}>
                          {/* Datum */}
                          <td style={{padding:"5px 6px",color:rowColor(r),fontWeight:700,fontSize:11,whiteSpace:"nowrap"}}>
                            {wdName[r.wd]}. {new Date(ymY,ymM-1,parseInt(r.dateStr.split("-")[2]),12).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}
                          </td>
                          {/* Beginn – immer editierbar */}
                          <td style={{padding:"3px 4px"}}>
                            <input type="time" value={r.beginn||""} onChange={e=>setSpesenOverrides(p=>({...p,[r.dateStr]:{...(p[r.dateStr]||{}),beginn:e.target.value}}))}
                              style={{width:76,border:"1px solid "+(r.isFeiertag?"#FFB74D":r.isUrlaub?"#BDBDBD":"#E5E5EA"),borderRadius:5,padding:"3px 3px",fontSize:11,
                                background:r.beginn&&!spesenOverrides[r.dateStr]?.beginn&&r.hasLogData?"#E8F5E9":r.isFeiertag?"#FFF8F0":r.isUrlaub?"#FAFAFA":"#fff"}}/>
                          </td>
                          {/* Ende – immer editierbar */}
                          <td style={{padding:"3px 4px"}}>
                            <input type="time" value={r.ende||""} onChange={e=>setSpesenOverrides(p=>({...p,[r.dateStr]:{...(p[r.dateStr]||{}),ende:e.target.value}}))}
                              style={{width:76,border:"1px solid "+(r.isFeiertag?"#FFB74D":r.isUrlaub?"#BDBDBD":"#E5E5EA"),borderRadius:5,padding:"3px 3px",fontSize:11,
                                background:r.ende&&!spesenOverrides[r.dateStr]?.ende&&r.hasLogData?"#E8F5E9":r.isFeiertag?"#FFF8F0":r.isUrlaub?"#FAFAFA":"#fff"}}/>
                          </td>
                          {/* Reiseort – Typ-Dropdown + Stadt-Input */}
                          <td style={{padding:"3px 4px"}}>
                            <div style={{display:"flex",flexDirection:"column",gap:2}}>
                              <select value={r.dayType}
                                onChange={e=>{const v=e.target.value;setSpesenOverrides(p=>{const cur={...(p[r.dateStr]||{})};cur.dayType=v;delete cur.beginn;delete cur.ende;return{...p,[r.dateStr]:cur};})}}
                                style={{fontSize:10,border:"1px solid "+(r.isFeiertag?"#FFB74D":r.isUrlaub?"#BDBDBD":r.isKrank?"#90CAF9":r.isUeAbbau?"#CE93D8":"#E5E5EA"),
                                  borderRadius:5,padding:"2px 3px",background:rowBg(r),color:rowColor(r),fontWeight:600,width:100}}>
                                <option value="stadt">🏙 Stadt</option>
                                <option value="krank">🤒 Krank</option>
                                <option value="urlaub">🏖 Urlaub</option>
                                <option value="ue_abbau">⏱ ÜE-Abbau</option>
                                <option value="feiertag">🎉 Feiertag</option>
                              </select>
                              {r.dayType==="stadt"&&(
                                <input value={r.reiseort||""} onChange={e=>setSpesenOverrides(p=>({...p,[r.dateStr]:{...(p[r.dateStr]||{}),reiseort:e.target.value}}))}
                                  placeholder="—"
                                  style={{width:100,border:"1px solid #E5E5EA",borderRadius:5,padding:"3px 5px",fontSize:11}}/>
                              )}
                            </div>
                          </td>
                          {/* Dauer */}
                          <td style={{padding:"5px 4px",textAlign:"center",fontWeight:700,fontSize:11,
                            color:r.isFeiertag||r.isUrlaub?"#8E8E93":r.dauerMins>r.sollMins?"#34C759":r.dauerMins>0&&r.dauerMins<r.sollMins?"#FF9500":"#1C1C1E"}}>
                            {fmtHHMM(r.dauerMins)}
                          </td>
                          {/* Soll */}
                          <td style={{padding:"5px 4px",textAlign:"center",color:"#8E8E93",fontSize:11}}>{fmtHHMM(r.sollMins)}</td>
                          {/* Verpflegung – editierbar */}
                          <td style={{padding:"3px 4px"}}>
                            <input type="number" min="0" step="1" value={r.verpflegung}
                              onChange={e=>setSpesenOverrides(p=>({...p,[r.dateStr]:{...(p[r.dateStr]||{}),verpflegung:parseFloat(e.target.value)||0}}))}
                              style={{width:48,border:"1px solid "+(r.verpflegung>0?"#34C759":"#E5E5EA"),borderRadius:5,padding:"3px 4px",fontSize:11,textAlign:"center",
                                color:r.verpflegung>0?"#34C759":"#8E8E93",fontWeight:r.verpflegung>0?700:400}}/>
                          </td>
                        </tr>
                      ))}
                      <tr style={{background:"#1a3a5a",color:"#fff",fontWeight:700}}>
                        <td colSpan={4} style={{padding:"7px 6px",fontSize:11}}>SUMMEN MONAT</td>
                        <td style={{padding:"7px 4px",textAlign:"center",fontSize:11}}>{fmtHHMM(totalDauer)}</td>
                        <td style={{padding:"7px 4px",textAlign:"center",fontSize:11}}>{fmtHHMM(totalSoll)}</td>
                        <td style={{padding:"7px 4px",textAlign:"center",fontSize:11}}>{fmtEur(totalVerpf)}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Sonstige Kosten + Überstunden – stacked on mobile */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8,marginBottom:10}}>
                {/* Sonstige Kosten */}
                <div style={{background:"#fff",borderRadius:12,padding:"11px 12px",boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#1a3a5a",marginBottom:8,letterSpacing:.3}}>SONSTIGE KOSTEN</div>
                  {[["Diesel",diesel],["Parken",parken],["Hotel",hotel],["Sonstiges",sonstiges]].map(([lbl,val])=>(
                    <div key={lbl} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"0.5px solid #F2F2F7",fontSize:12}}>
                      <span style={{color:"#3C3C3C"}}>{lbl}</span>
                      <span style={{fontWeight:600,color:"#1C1C1E"}}>{fmtEur(val)}</span>
                    </div>
                  ))}
                  <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",marginTop:2,fontSize:12,fontWeight:700,color:"#1a3a5a"}}>
                    <span>GESAMT</span><span>{fmtEur(gesamtSonstige)}</span>
                  </div>
                  <div style={{fontSize:10,color:"#8E8E93",marginTop:3}}>{expFiltered.length} Belege dieses Monats</div>
                </div>

                {/* Überstunden */}
                <div style={{background:"#fff",borderRadius:12,padding:"11px 12px",boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#1a3a5a",marginBottom:8,letterSpacing:.3}}>ÜBERSTUNDEN</div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"0.5px solid #F2F2F7"}}>
                    <span style={{fontSize:12,color:"#3C3C3C"}}>Vormonat</span>
                    <input type="text" placeholder="hh:mm" value={fmtHHMM(ueVorMins)}
                      onChange={e=>{const v=e.target.value;if(/^-?\d*:?\d*$/.test(v)){const neg=v.startsWith("-");const clean=v.replace("-","");const parts=clean.split(":");const mins=(parts.length===2?parseInt(parts[0]||0)*60+parseInt(parts[1]||0):parseInt(parts[0]||0)*60)*(neg?-1:1);setSpesenOverrides(p=>({...p,["__uevormonat_"+spesenMonth]:mins}));}}}
                      style={{width:60,border:"1px solid #E5E5EA",borderRadius:6,padding:"3px 5px",fontSize:12,textAlign:"center",background:"#fff",color:"#1C1C1E",fontWeight:600}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"0.5px solid #F2F2F7"}}>
                    <span style={{fontSize:12,color:"#3C3C3C"}}>Diesen Monat</span>
                    <span style={{fontSize:12,fontWeight:700,color:ueMonat>=0?"#34C759":"#FF3B30"}}>{fmtHHMM(ueMonat)}</span>
                  </div>
                  {ueAbbauMins>0&&(
                    <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"0.5px solid #F2F2F7"}}>
                      <span style={{fontSize:12,color:"#6A1B9A"}}>ÜE-Abbau</span>
                      <span style={{fontSize:12,fontWeight:700,color:"#6A1B9A"}}>−{fmtHHMM(ueAbbauMins)}</span>
                    </div>
                  )}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:"0.5px solid #F2F2F7"}}>
                    <span style={{fontSize:12,color:"#3C3C3C"}}>Abgefeiert</span>
                    <input type="text" placeholder="hh:mm" value={abgefeiertStr}
                      onChange={e=>setSpesenAbgefeiertUe(p=>({...p,[spesenMonth]:e.target.value}))}
                      style={{width:60,border:"1px solid #E5E5EA",borderRadius:6,padding:"3px 5px",fontSize:12,textAlign:"center"}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",marginTop:2,fontSize:12,fontWeight:700,color:"#1a3a5a"}}>
                    <span>GESAMT ÜBRIG</span>
                    <span style={{color:ueGesamt>=0?"#34C759":"#FF3B30"}}>{fmtHHMM(ueGesamt)}</span>
                  </div>
                </div>
              </div>

              {/* Spesen Gesamt */}
              <div style={{background:"#1a3a5a",borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{color:"#fff",fontSize:14,fontWeight:700,fontFamily:"-apple-system,sans-serif"}}>SPESEN GESAMT</span>
                <span style={{color:"#4ade80",fontSize:18,fontWeight:700,fontFamily:"-apple-system,sans-serif"}}>{fmtEur(spesenGesamt)}</span>
              </div>

              {/* Legende */}
              <div style={{fontSize:10,color:"#8E8E93",lineHeight:1.7,fontFamily:"-apple-system,sans-serif",paddingBottom:8}}>
                🟢 Arbeit · 🟠 Feiertag · ⬜ Urlaub · 🤒 Krank · ⏱ ÜE-Abbau · Verpflegung: 14 € ab 8h Arbeitszeit
              </div>
            </div>

            {/* Export Format Picker */}
            {showSpesenExport&&(
              <div style={{position:"fixed",inset:0,zIndex:900,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
                <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.5)",cursor:"pointer"}} onClick={()=>setShowSpesenExport(false)}/>
                <div style={{position:"relative",background:"#FFFFFF",borderRadius:20,padding:24,maxWidth:320,width:"100%",zIndex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <div style={{fontSize:17,fontWeight:700,color:"#1C1C1E",fontFamily:"-apple-system,sans-serif"}}>📋 Format wählen</div>
                    <button onClick={()=>setShowSpesenExport(false)} style={{background:"#F2F2F7",border:"none",borderRadius:50,width:30,height:30,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#8E8E93"}}>✕</button>
                  </div>
                  <div style={{fontSize:13,color:"#8E8E93",fontFamily:"-apple-system,sans-serif",marginBottom:16}}>Wie soll die Abrechnung exportiert werden?</div>
                  <button className="btn" onClick={exportXlsx} style={{width:"100%",background:"#34C759",color:"#fff",border:"none",borderRadius:12,padding:"14px",marginBottom:8,fontSize:14,fontWeight:600,fontFamily:"-apple-system,sans-serif",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span>📊 Excel (.xlsx)</span><span style={{fontSize:16}}>›</span>
                  </button>
                  <button className="btn" onClick={exportPdf} style={{width:"100%",background:"#007AFF",color:"#fff",border:"none",borderRadius:12,padding:"14px",marginBottom:8,fontSize:14,fontWeight:600,fontFamily:"-apple-system,sans-serif",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span>🖨 PDF (Drucken)</span><span style={{fontSize:16}}>›</span>
                  </button>
                  <button className="btn" onClick={()=>setShowSpesenExport(false)} style={{width:"100%",background:"#E5E5EA",color:"#8E8E93",border:"none",borderRadius:12,padding:"13px",fontSize:14,fontFamily:"-apple-system,sans-serif",marginTop:4}}>Abbrechen</button>
                </div>
              </div>
            )}
          </div>
        );
      })()}
    </>
  );
}

  </script>
</body>
</html>
