name: fadenlauf-web
on:
  push: { paths: ["fadenlauf-web/**"] }
  pull_request: { paths: ["fadenlauf-web/**"] }
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fadenlauf-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: fadenlauf-web/package-lock.json }
      - run: npm ci
      - run: npm run check
