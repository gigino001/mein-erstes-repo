services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cocolashes
      POSTGRES_USER: cocolashes
      POSTGRES_PASSWORD: cocolashes_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - coco_postgres_data:/var/lib/postgresql/data

volumes:
  coco_postgres_data:
