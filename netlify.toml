[build]
  base = "website"
  # No custom `command` here on purpose: with one set (even just forcing
  # --webpack), Netlify's zero-config Next.js Runtime never bundled server
  # functions ("No functions deployed" in every deploy that had a command
  # override) even though the build itself succeeded and the database got
  # provisioned. The webpack-vs-Turbopack fix (needed so the Runtime's
  # "Collecting build traces" step runs) now lives in package.json's own
  # "build" script instead, so the default `npm run build` picks it up
  # without netlify.toml overriding anything.
