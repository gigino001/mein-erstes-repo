[build]
  base = "website"
  # Turbopack builds (this project's default) skip the "Collecting build
  # traces" step that Netlify's Next.js Runtime needs to bundle server
  # functions, so force the webpack builder here.
  #
  # Deliberately no explicit `[[plugins]] package = "@netlify/plugin-nextjs"`
  # block: declaring it explicitly stopped Netlify from auto-provisioning
  # the Netlify DB (Postgres) on every deploy that had it, even though the
  # zero-config framework detection provisions it fine on its own.
  command = "npm run build -- --webpack"
